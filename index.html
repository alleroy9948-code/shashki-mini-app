<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172033"><meta name="description" content="Русские шашки — игра против компьютера или вдвоём на одном устройстве."><title>Шашки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101827;--panel:#1b263b;--light:#f0d9b5;--dark:#8a5a3b;--accent:#58d6a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fb;font:16px system-ui,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:min(100%,520px);padding:16px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between}.title{font-size:26px;font-weight:800}.badge{background:#26344d;padding:7px 11px;border-radius:20px;font-size:13px}
.card{background:var(--panel);padding:14px;border-radius:18px;box-shadow:0 8px 28px #0002}.status{font-weight:700;font-size:17px}.hint{color:#b7c4d8;font-size:13px;margin-top:5px}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:5px solid #583a2a;border-radius:9px;overflow:hidden;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;aspect-ratio:1}.light{background:var(--light)}.dark{background:var(--dark)}.cell.selected{box-shadow:inset 0 0 0 4px #58d6a5}.cell.move:after{content:"";width:30%;height:30%;border-radius:50%;background:#58d6a5;opacity:.9;position:absolute}
.piece{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 #0004,0 2px 4px #0005;border:3px solid #ffffff4d;z-index:1}
.white{background:linear-gradient(#fff,#d9e0eb);border-color:#b7c2d2}.black{background:linear-gradient(#333b4b,#10151f);border-color:#596273}.king:after{content:"♛";font-size:clamp(17px,5vw,25px);color:#e8c66d;text-shadow:0 1px 2px #000}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:12px;padding:12px 10px;font:700 14px system-ui;cursor:pointer;background:#2a3952;color:#fff}button.primary{background:var(--accent);color:#10251d}button:active{transform:scale(.98)}
.footer{text-align:center;color:#7f91ad;font-size:12px}
</style>
</head>
<body><main>
<div class="top"><div class="title">♟ Шашки</div><div class="badge">Mini App</div></div>
<section class="card"><div class="status" id="status">Ход белых</div><div class="hint" id="hint">Выберите шашку, затем клетку для хода.</div></section>
<div class="board" id="board" aria-label="Игровая доска"></div>
<section class="card controls"><button class="primary" id="new">Новая игра</button><button id="mode">Режим: против компьютера</button><button id="undo">Отменить ход</button><button id="flip">Перевернуть доску</button></section>
<div class="footer">Русские шашки · обязательное взятие · дамки</div>
</main>
<script>
(function(){
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),hintEl=document.getElementById('hint');
let b,turn,selected=null,legal=[],history=[],mode='cpu',flipped=false,gameOver=false;
const dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
function initial(){b=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r][c]={side:'b',king:false};for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r][c]={side:'w',king:false};turn='w';selected=null;legal=[];history=[];gameOver=false;render();if(mode==='cpu'&&turn==='b')setTimeout(cpuMove,350)}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function movesFor(r,c,capturesOnly=false){const p=b[r][c];if(!p)return[];let out=[];
 if(p.king){for(const [dr,dc] of dirs){let rr=r+dr,cc=c+dc,enemy=null;while(inside(rr,cc)){const q=b[rr][cc];if(!q){if(!capturesOnly){if(!enemy)out.push({from:[r,c],to:[rr,cc],cap:null});else out.push({from:[r,c],to:[rr,cc],cap:enemy})}}else if(q.side===p.side||enemy)break;else enemy=[rr,cc];rr+=dr;cc+=dc}}}
 else {for(const [dr,dc] of dirs){if(!capturesOnly){if(dr===(p.side==='w'?-1:1)){const rr=r+dr,cc=c+dc;if(inside(rr,cc)&&!b[rr][cc])out.push({from:[r,c],to:[rr,cc],cap:null})}}
 const mr=r+dr,mc=c+dc,rr=r+2*dr,cc=c+2*dc;if(inside(rr,cc)&&inside(mr,mc)&&b[mr][mc]&&b[mr][mc].side!==p.side&&!b[rr][cc])out.push({from:[r,c],to:[rr,cc],cap:[mr,mc]})}}
 return out}
function allMoves(side){let all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.side===side)all.push(...movesFor(r,c));const caps=all.filter(m=>m.cap);return caps.length?caps:all}
function save(){history.push({b:b.map(row=>row.map(p=>p?{...p}:null)),turn,gameOver});if(history.length>80)history.shift()}
function perform(m){save();const [r,c]=m.from,[rr,cc]=m.to,p=b[r][c];b[rr][cc]=p;b[r][c]=null;if(m.cap){const [cr,ccap]=m.cap;b[cr][ccap]=null}
 if((p.side==='w'&&rr===0)||(p.side==='b'&&rr===7))p.king=true;
 if(m.cap){const more=movesFor(rr,cc,true);if(more.length){selected=[rr,cc];legal=more;render();hintEl.textContent='Продолжайте взятие этой шашкой.';return}}
 selected=null;legal=[];turn=turn==='w'?'b':'w';const next=allMoves(turn);if(!next.length){gameOver=true;statusEl.textContent='Победа '+(turn==='w'?'чёрных':'белых')+'!';hintEl.textContent='У соперника не осталось ходов.';render();return}
 render();if(mode==='cpu'&&turn==='b'&&!gameOver)setTimeout(cpuMove,350)}
function choose(r,c){if(gameOver||mode==='cpu'&&turn==='b')return;
 if(selected&&legal.some(m=>m.to[0]===r&&m.to[1]===c)){perform(legal.find(m=>m.to[0]===r&&m.to[1]===c));return}
 if(b[r][c]?.side===turn){const all=allMoves(turn);selected=[r,c];legal=all.filter(m=>m.from[0]===r&&m.from[1]===c);if(!legal.length){selected=null;legal=[]}render();return}
 selected=null;legal=[];render()}
function cpuMove(){if(gameOver||turn!=='b'||mode!=='cpu')return;const ms=allMoves('b');if(!ms.length)return;ms.sort((a,z)=>(z.cap?10:0)+(b[z.to[0]][z.to[1]]?.king?1:0)-((a.cap?10:0)+(b[a.to[0]][a.to[1]]?.king?1:0)));perform(ms[0])}
function render(){boardEl.innerHTML='';for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,cell=document.createElement('button');cell.className='cell '+((r+c)%2?'dark':'light');cell.setAttribute('aria-label',String.fromCharCode(65+c)+(8-r));cell.style.padding='0';cell.onclick=()=>choose(r,c);if(selected&&selected[0]===r&&selected[1]===c)cell.classList.add('selected');if(legal.some(m=>m.to[0]===r&&m.to[1]===c))cell.classList.add('move');const p=b[r][c];if(p){const piece=document.createElement('div');piece.className='piece '+(p.side==='w'?'white':'black')+(p.king?' king':'');cell.appendChild(piece)}boardEl.appendChild(cell)}
 if(!gameOver){statusEl.textContent='Ход '+(turn==='w'?'белых':'чёрных');hintEl.textContent=(mode==='cpu'&&turn==='b')?'Компьютер выбирает ход…':'Выберите шашку, затем клетку для хода.'}}
document.getElementById('new').onclick=initial;
document.getElementById('mode').onclick=()=>{mode=mode==='cpu'?'local':'cpu';document.getElementById('mode').textContent='Режим: '+(mode==='cpu'?'против компьютера':'2 игрока');initial()};
document.getElementById('undo').onclick=()=>{if(!history.length)return;const s=history.pop();b=s.b;turn=s.turn;gameOver=s.gameOver;selected=null;legal=[];render()};
document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};
if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}
initial();
})();
</script></body></html>
