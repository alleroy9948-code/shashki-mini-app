<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover>
<meta name="theme-color" content="#172033"><meta name="description" content="Русские шашки: игра против компьютера, на одном устройстве или онлайн с другом по ссылке."><title>Шашки</title>
<script id="telegramSdk" src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>

:root{color-scheme:dark;--bg:#080d19;--panel:#121d31;--line:rgba(176,202,239,.13);--text:#f4f7ff;--muted:#9cadc7;--mint:#63e6b4;--gold:#f1ca77}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;justify-content:center;color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 14% 0%,rgba(57,96,163,.27),transparent 33%),radial-gradient(ellipse at 100% 38%,rgba(39,129,115,.12),transparent 35%),linear-gradient(155deg,#0b1222 0%,#080d19 62%,#0b1424 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(171,197,232,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(171,197,232,.055) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
main{position:relative;z-index:1;width:min(100%,860px);padding:66px clamp(15px,4vw,24px) 26px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 2px 5px}
.tabbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:5px;border:1px solid var(--line);border-radius:16px;background:rgba(13,22,38,.88)}
.tab-button{min-height:44px;border:1px solid transparent;background:transparent;box-shadow:none;color:var(--muted);font-weight:850}
.tab-button.active{color:#06271d;background:linear-gradient(135deg,#8af3c9,#53dca8);border-color:rgba(177,255,221,.75)}
.pane{display:none;min-width:0}
main .board-pane{display:flex;flex-direction:column;gap:12px}
main .menu-pane{display:none;min-width:0}
.board-pane .game-status{padding:10px 14px;border-radius:15px}
.board-pane .game-status .status{font-size:clamp(16px,4vw,19px)}
.board-pane .game-status .hint{font-size:12px;margin-top:4px}
.menu-toggle{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
@media(max-width:390px){.card{backdrop-filter:none;-webkit-backdrop-filter:none}}
main[data-menu-open="true"] .menu-pane{display:flex;position:fixed;inset:0;z-index:500;flex-direction:column;gap:14px;padding:72px 14px 22px;background:rgba(5,10,19,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow-y:auto}
.menu-toggle{position:fixed;top:10px;right:10px;z-index:600;width:46px;height:46px;min-height:46px;padding:0;border-radius:14px;display:grid;place-items:center;font-size:21px;color:#f4f7ff;background:rgba(16,29,48,.94);border:1px solid rgba(99,230,180,.4);box-shadow:0 8px 24px #0005}
.menu-close{width:44px;height:44px;min-height:44px;flex:0 0 44px;padding:0;font-size:20px;border-radius:13px}
.menu-pane .top{gap:10px}
.board-shell{width:100%}
.board-pane{width:100%;display:flex;flex-direction:column;gap:12px}
.board-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.board-color{padding:12px}
.board-color-title{font-size:14px;font-weight:850;margin:0 0 9px}
.board-color .color-option{min-height:54px;padding:8px}
.board-color .color-preview span{width:19px;height:19px}
@media(min-width:650px){.board-color .color-options{grid-template-columns:1fr 1fr}}
main[data-tab="board"]{width:min(100%,860px)}
@media(max-width:390px){.tab-button{font-size:12px;padding:10px 4px}.tabbar{gap:4px;padding:4px}}
.settings-title{font-size:20px;font-weight:850;letter-spacing:-.4px}
.settings-copy{color:var(--muted);font-size:13px;margin:6px 0 18px}
.setting-label{display:block;font-weight:800;margin:0 0 10px}
.color-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-option{display:flex;align-items:center;gap:12px;min-height:74px;padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(10,18,31,.72);cursor:pointer}
.color-option:has(input:checked){border-color:rgba(99,230,180,.75);background:rgba(33,75,65,.38);box-shadow:inset 0 0 0 1px rgba(99,230,180,.12)}
.color-option input{accent-color:var(--mint);width:18px;height:18px}
.color-preview{display:flex;gap:4px}
.color-preview span{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #ffffff66;box-shadow:inset 0 -3px 0 #0003}
.color-preview .light-piece{background:linear-gradient(145deg,#fff,#cbd5e2)}
.color-preview .dark-piece{background:linear-gradient(145deg,#53647e,#101725)}
.setting-note{margin-top:14px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:12px;line-height:1.55}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border:1px solid rgba(122,236,202,.3);border-radius:16px;background:linear-gradient(145deg,rgba(99,230,180,.18),rgba(52,102,122,.14));box-shadow:inset 0 1px rgba(255,255,255,.07),0 8px 22px #0004;color:var(--mint);font-size:27px}
.brand-copy{min-width:0}
.title{font-size:clamp(25px,6vw,30px);font-weight:850;letter-spacing:-.9px;line-height:1.05}
.subtitle{margin-top:5px;color:#8295b3;font-size:10px;font-weight:800;letter-spacing:1.65px}
.badge{display:flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(21,34,55,.84);color:#c7d5e9;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.4px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px rgba(99,230,180,.7)}
.card{background:linear-gradient(145deg,rgba(23,37,60,.94),rgba(14,24,41,.96));border:1px solid var(--line);padding:16px;border-radius:20px;box-shadow:0 16px 38px rgba(0,0,0,.19),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(12px)}
.game-status{position:relative;overflow:hidden;padding:18px}
.game-status:after{content:"";position:absolute;right:-32px;top:-55px;width:150px;height:150px;border-radius:50%;background:rgba(99,230,180,.06);filter:blur(4px);pointer-events:none}
.status{position:relative;z-index:1;display:flex;align-items:center;gap:9px;font-size:clamp(18px,4.8vw,21px);font-weight:850;letter-spacing:-.35px}
.status:before{content:"";width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px rgba(99,230,180,.1),0 0 14px rgba(99,230,180,.36)}
.hint{position:relative;z-index:1;color:var(--muted);font-size:13px;margin-top:7px;line-height:1.5}
.players-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player-chip{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(140deg,rgba(22,34,54,.88),rgba(13,22,38,.96));transition:border-color .18s,background .18s,transform .18s}
.player-chip.is-turn{border-color:rgba(99,230,180,.5);background:linear-gradient(140deg,rgba(29,67,65,.65),rgba(15,34,46,.96));box-shadow:inset 0 0 0 1px rgba(99,230,180,.07),0 6px 20px rgba(0,0,0,.12)}
.player-disc{width:27px;height:27px;flex:0 0 27px;border-radius:50%;border:2px solid rgba(255,255,255,.45);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 2px 5px #0004}
.white-disc{background:radial-gradient(circle at 34% 23%,#fff 0%,#f9f4eb 36%,#cbd5e2 100%)}
.black-disc{background:radial-gradient(circle at 34% 23%,#7b8ba4 0%,#374258 38%,#111827 100%);border-color:#6e7f99}
.player-copy{display:flex;flex-direction:column;min-width:0;flex:1}
.player-copy strong{font-size:12px;font-weight:850;white-space:nowrap}
.player-copy small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-tag{font-size:8px;font-weight:900;letter-spacing:.6px;color:var(--mint);opacity:0;white-space:nowrap}
.player-chip.is-turn .turn-tag{opacity:1}
.board-shell{padding:8px;border-radius:19px;border:1px solid rgba(208,177,136,.3);background:linear-gradient(145deg,#876044,#4b3026 70%,#32221c);box-shadow:0 20px 40px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.2)}
.board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:1px solid rgba(38,22,15,.72);border-radius:12px;overflow:hidden;touch-action:manipulation;isolation:isolate}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;aspect-ratio:1;padding:0!important;margin:0;border:0;border-radius:0;box-shadow:none;background:transparent;cursor:pointer;overflow:hidden}
.cell.light{background:linear-gradient(135deg,#f6e7d0 0%,#e7cda9 100%)}
.cell.dark{background:linear-gradient(135deg,#96694a 0%,#75462f 100%)}
.cell.dark:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 60%);pointer-events:none}
.cell.selected{z-index:2;box-shadow:inset 0 0 0 3px #63f1be,inset 0 0 18px rgba(66,249,185,.32)}
.cell.move:after{content:"";position:absolute;width:28%;height:28%;border:2px solid rgba(228,255,245,.86);border-radius:50%;background:rgba(58,224,168,.74);box-shadow:0 0 16px rgba(49,245,183,.55);z-index:2;animation:movePulse 1.3s ease-in-out infinite}
@keyframes movePulse{0%,100%{transform:scale(.88);opacity:.76}50%{transform:scale(1.08);opacity:1}}
.piece{position:relative;width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1;transition:filter .18s ease;box-shadow:inset 0 -5px 0 rgba(0,0,0,.23),inset 0 2px 3px rgba(255,255,255,.55),0 4px 7px rgba(31,16,9,.4);border:2px solid rgba(255,255,255,.53);will-change:transform}
.piece:before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 3px rgba(0,0,0,.13);pointer-events:none}
.piece.white{background:radial-gradient(circle at 34% 23%,#fff 0%,#f9f4eb 33%,#d9dfe8 72%,#b6c2d2 100%);border-color:#fff9ed}
.piece.black{background:radial-gradient(circle at 34% 23%,#7b8ba4 0%,#374258 33%,#202b3f 72%,#101725 100%);border-color:#7587a2}
.piece.king:after{content:"♛";position:relative;z-index:2;font-size:clamp(15px,4.8vw,26px);line-height:1;color:var(--gold);text-shadow:0 2px 3px #1b150b,0 0 10px rgba(241,202,119,.27)}
.piece.moving{will-change:transform}
.cell.captured{animation:cellCapture .38s ease-out both}
.shard{position:absolute;z-index:5;left:0;top:0;width:8%;height:8%;border-radius:25%;pointer-events:none;will-change:transform,opacity;box-shadow:inset 0 1px 2px #ffffff8c,0 1px 3px #0005}
@keyframes cellCapture{0%{filter:brightness(1.8)}65%{filter:brightness(1.3)}100%{filter:brightness(1)}}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:1px solid rgba(173,199,231,.12);border-radius:14px;padding:13px 12px;min-height:48px;font:750 13px/1.25 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;cursor:pointer;background:linear-gradient(145deg,#243650,#1a2941);color:#eaf1fc;box-shadow:inset 0 1px rgba(255,255,255,.05),0 5px 12px rgba(0,0,0,.13);transition:transform .16s ease,border-color .16s ease,filter .16s ease}
button:hover{border-color:rgba(99,230,180,.37);filter:brightness(1.08)}
button:active{transform:scale(.975)}
button:focus-visible,input:focus-visible{outline:3px solid #7ef3c4;outline-offset:2px}
button.primary{color:#06271d;background:linear-gradient(135deg,#8af3c9,#53dca8);border-color:rgba(177,255,221,.75);box-shadow:0 7px 18px rgba(49,216,157,.16),inset 0 1px rgba(255,255,255,.55)}
button .btn-icon{display:inline-block;margin-right:6px;font-size:15px;line-height:1;vertical-align:-1px}
#online{grid-column:1/-1;background:linear-gradient(110deg,rgba(50,91,113,.7),rgba(30,51,78,.9));border-color:rgba(99,230,180,.19)}
#flip,#undo{color:#b8c9df}
#onlinePanel[hidden]{display:none!important}
#onlinePanel input{font:inherit!important;min-height:46px;border-radius:12px!important;border:1px solid rgba(160,188,223,.2)!important;background:#0d1729!important;outline:none}
#onlinePanel input:focus{border-color:rgba(99,230,180,.65)!important}
#onlinePanel .controls{margin-top:2px}
.footer{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;color:#7184a3;font-size:11px;letter-spacing:.35px;padding:0 8px 4px}
.footer:before,.footer:after{content:"";height:1px;flex:1;max-width:65px;background:linear-gradient(90deg,transparent,rgba(137,165,201,.24))}
.result-overlay{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;padding:22px;background:rgba(4,8,17,.76);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);opacity:0;transition:opacity .22s ease}
.result-overlay[hidden]{display:none!important}
.result-overlay.show{opacity:1}
.result-dialog{width:min(100%,380px);position:relative;overflow:hidden;text-align:center;padding:28px 23px 23px;border:1px solid rgba(160,199,223,.2);border-radius:26px;background:radial-gradient(ellipse at 50% 0%,rgba(99,230,180,.16),transparent 50%),linear-gradient(150deg,#1b2b45,#101a2c 74%);box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.07);transform:translateY(12px) scale(.97);transition:transform .24s cubic-bezier(.18,.8,.2,1)}
.result-overlay.show .result-dialog{transform:translateY(0) scale(1)}
.result-dialog.is-loss{background:radial-gradient(ellipse at 50% 0%,rgba(255,99,115,.13),transparent 52%),linear-gradient(150deg,#2d2639,#171a2b 74%)}
.result-icon{width:82px;height:82px;display:grid;place-items:center;margin:0 auto 17px;border-radius:26px;border:1px solid rgba(99,230,180,.29);background:linear-gradient(145deg,rgba(99,230,180,.17),rgba(41,82,100,.1));font-size:39px;box-shadow:0 10px 28px #0003,inset 0 1px rgba(255,255,255,.1)}
.result-dialog.is-loss .result-icon{border-color:rgba(255,134,145,.32);background:linear-gradient(145deg,rgba(255,111,125,.16),rgba(92,47,75,.12))}
.result-kicker{font-size:10px;font-weight:900;letter-spacing:2.2px;text-transform:uppercase;color:var(--mint);margin-bottom:7px}
.result-dialog.is-loss .result-kicker{color:#ff9aa6}
.result-dialog h2{margin:0;color:#fff;font-size:29px;letter-spacing:-.9px;font-weight:900;line-height:1.1}
.result-dialog p{font-size:14px;line-height:1.65;color:#aebdd4;margin:12px 0 23px}
.result-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:9px}
.result-actions button{width:100%}
@media(max-width:390px){main{padding:60px 13px 20px;gap:13px}.brand-mark{width:43px;height:43px;flex-basis:43px;border-radius:14px}.subtitle{font-size:9px;letter-spacing:1.1px}.badge{font-size:10px;padding:8px 9px}.game-status{padding:15px}.card{padding:14px}.board-shell{padding:6px}.controls{gap:8px}button{padding:12px 8px;font-size:12px}.result-dialog{padding:24px 17px 19px}.player-chip{padding:10px 8px;gap:7px}.player-disc{width:23px;height:23px;flex-basis:23px}.turn-tag{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body><main data-menu-open="false">
<button type="button" class="menu-toggle" id="menuToggle" aria-label="Открыть меню" aria-expanded="false" aria-controls="menuPane">☰</button>
<div class="pane board-pane" id="boardPane" role="tabpanel" aria-label="Игровая доска">
<section class="card board-actions"><button class="primary" id="new"><span class="btn-icon">↻</span>Новая игра</button><button id="undo"><span class="btn-icon">↶</span>Отменить ход</button></section>
<section class="card game-status"><div class="status" id="status" aria-live="polite">Ход белых</div><div class="hint" id="hint" aria-live="polite">Выберите шашку, затем клетку для хода.</div></section>
<section class="card board-color" aria-label="Выбор цвета шашек"><div class="board-color-title">Мои шашки</div><div class="color-options"><label class="color-option"><input type="radio" name="playerColor" value="w" checked><span class="color-preview"><span class="light-piece"></span></span><span><strong>Белые</strong><br><small style="color:var(--muted)">Хожу первым</small></span></label><label class="color-option"><input type="radio" name="playerColor" value="b"><span class="color-preview"><span class="dark-piece"></span></span><span><strong>Чёрные</strong><br><small style="color:var(--muted)">Компьютер начинает</small></span></label></div><button type="button" class="primary" id="applySettings" style="width:100%;margin-top:10px">Применить цвет и начать</button></section>
<section class="board-shell"><div class="board" id="board" aria-label="Игровая доска"></div></section>
</div>
<div class="pane menu-pane" id="menuPane" role="tabpanel" aria-label="Меню игры">
<div class="top"><div class="brand"><div class="brand-mark" aria-hidden="true">♟</div><div class="brand-copy"><div class="title">Шашки</div><div class="subtitle">РУССКАЯ КЛАССИКА · 8×8</div></div></div><div class="badge"><span class="live-dot"></span> 1 на 1</div><button type="button" id="closeMenu" class="menu-close" aria-label="Закрыть меню">✕</button></div>
<section class="players-strip" aria-label="Участники партии"><div class="player-chip" id="playerWhite"><span class="player-disc white-disc" aria-hidden="true"></span><span class="player-copy"><strong>Белые</strong><small id="labelWhite">Вы</small></span><span class="turn-tag">ХОД</span></div><div class="player-chip" id="playerBlack"><span class="player-disc black-disc" aria-hidden="true"></span><span class="player-copy"><strong>Чёрные</strong><small id="labelBlack">Компьютер</small></span><span class="turn-tag">ХОД</span></div></section>
<section class="card controls"><button id="mode"><span class="btn-icon">♟</span>Режим: против компьютера</button><button id="online"><span class="btn-icon">↗</span>Играть с другом онлайн</button><button id="flip"><span class="btn-icon">⇄</span>Перевернуть доску</button></section>

<section class="card" id="onlinePanel" hidden><div class="status">Игра с другом онлайн</div><div class="hint" id="onlineInfo">Создайте комнату или подключитесь по коду/ссылке.</div><input id="roomCode" placeholder="Код комнаты или ID друга" style="width:100%;margin:10px 0;padding:12px;border-radius:10px;border:1px solid #52627a;background:#101827;color:#fff"><input id="inviteLink" readonly placeholder="Ссылка появится после создания комнаты" style="width:100%;margin:0 0 10px;padding:12px;border-radius:10px;border:1px solid #52627a;background:#101827;color:#fff"><div class="controls"><button class="primary" id="createRoom">Создать комнату</button><button id="joinRoom">Подключиться</button><button id="copyInvite">Копировать ссылку</button><button id="shareInvite">Пригласить друга</button><button id="closeOnline">Выйти из онлайн-игры</button></div></section>
<div class="footer">Русские шашки · обязательное взятие · дамки</div>
</div>

<div class="result-overlay" id="resultModal" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="result-dialog" id="resultDialog">
    <div class="result-icon" id="resultIcon" aria-hidden="true">🏆</div>
    <div class="result-kicker">ПАРТИЯ ЗАВЕРШЕНА</div>
    <h2 id="resultTitle">Победа!</h2>
    <p id="resultMessage">Партия завершена.</p>
    <div class="result-actions">
      <button class="primary" id="resultNew">Сыграть ещё</button>
      <button id="resultClose">К доске</button>
    </div>
  </div>
</div>
</main>
<script>
(function(){
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),hintEl=document.getElementById('hint');
let b,turn,selected=null,legal=[],history=[],mode='cpu',flipped=false,gameOver=false;
let mustContinueCapture=false,turnSnapshotSaved=false,cpuTimer=null,peerSdkPromise=null;
let preferredSide='w';try{preferredSide=localStorage.getItem('shashki-player-color')==='b'?'b':'w'}catch(e){}
let online=false,onlinePeer=null,onlineConn=null,mySide=preferredSide,lastAnimatedFrom=null,lastAnimatedTo=null,lastCaptured=null,lastCapturedSide=null,pendingMoveOrigin=null;
const onlinePanel=document.getElementById('onlinePanel'),onlineInfo=document.getElementById('onlineInfo'),roomCode=document.getElementById('roomCode'),inviteLink=document.getElementById('inviteLink');
const resultModal=document.getElementById('resultModal'),resultDialog=document.getElementById('resultDialog'),resultTitle=document.getElementById('resultTitle'),resultMessage=document.getElementById('resultMessage'),resultIcon=document.getElementById('resultIcon');
const dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
function cpuSide(){return mySide==='w'?'b':'w'}
function initial(){if(cpuTimer!==null){clearTimeout(cpuTimer);cpuTimer=null}turnSnapshotSaved=false;mustContinueCapture=false;hideResult();flipped=mode==='cpu'&&mySide==='b';lastAnimatedFrom=null;lastAnimatedTo=null;lastCaptured=null;lastCapturedSide=null;pendingMoveOrigin=null;b=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r][c]={side:'b',king:false};for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r][c]={side:'w',king:false};turn='w';selected=null;legal=[];history=[];gameOver=false;render();if(mode==='cpu'&&turn===cpuSide())scheduleCpuMove(350)}
function hideResult(){if(!resultModal)return;resultModal.classList.remove('show');resultModal.hidden=true}
function showResult(winnerSide){
 if(!resultModal)return;
 const localTwoPlayers=mode==='local'&&!online;
 const isWin=online||mode==='cpu' ? winnerSide===mySide : true;
 const isLoss=!localTwoPlayers&&!isWin;
 if(localTwoPlayers){
  resultTitle.textContent='Победа '+(winnerSide==='w'?'белых':'чёрных')+'!';
  resultMessage.textContent='У соперника не осталось допустимых ходов.';
  resultIcon.textContent='🏆';
 }else if(isLoss){
  resultTitle.textContent='Поражение';
  resultMessage.textContent='У вас больше нет допустимых ходов. Ничего страшного — сыграйте ещё раз и возьмите реванш!';
  resultIcon.textContent='💔';
 }else{
  resultTitle.textContent='Победа!';
  resultMessage.textContent='Отличная партия! У соперника не осталось допустимых ходов.';
  resultIcon.textContent='🏆';
 }
 resultDialog.classList.toggle('is-loss',isLoss);
 resultDialog.classList.toggle('is-win',!isLoss);
 resultModal.hidden=false;
 requestAnimationFrame(()=>resultModal.classList.add('show'));
 if(isLoss&&navigator.vibrate){try{navigator.vibrate([120,55,160])}catch(e){}}
}
function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function movesFor(r,c,capturesOnly=false){const p=b[r][c];if(!p)return[];let out=[];
 if(p.king){for(const [dr,dc] of dirs){let rr=r+dr,cc=c+dc,enemy=null;while(inside(rr,cc)){const q=b[rr][cc];if(!q){if(!capturesOnly){if(!enemy)out.push({from:[r,c],to:[rr,cc],cap:null});else out.push({from:[r,c],to:[rr,cc],cap:enemy})}}else if(q.side===p.side||enemy)break;else enemy=[rr,cc];rr+=dr;cc+=dc}}}
 else {for(const [dr,dc] of dirs){if(!capturesOnly){if(dr===(p.side==='w'?-1:1)){const rr=r+dr,cc=c+dc;if(inside(rr,cc)&&!b[rr][cc])out.push({from:[r,c],to:[rr,cc],cap:null})}}
 const mr=r+dr,mc=c+dc,rr=r+2*dr,cc=c+2*dc;if(inside(rr,cc)&&inside(mr,mc)&&b[mr][mc]&&b[mr][mc].side!==p.side&&!b[rr][cc])out.push({from:[r,c],to:[rr,cc],cap:[mr,mc]})}}
 return out}
function allMoves(side){let all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.side===side)all.push(...movesFor(r,c));const caps=all.filter(m=>m.cap);return caps.length?caps:all}
function save(){if(turnSnapshotSaved)return;history.push({b:b.map(row=>row.map(p=>p?{...p}:null)),turn,gameOver});if(history.length>80)history.shift();turnSnapshotSaved=true}
function scheduleCpuMove(delay=350){if(cpuTimer!==null)clearTimeout(cpuTimer);cpuTimer=setTimeout(()=>{cpuTimer=null;cpuMove()},delay)}
function cellAt(r,c){return boardEl.querySelector('.cell[data-row="'+r+'"][data-col="'+c+'"]')}
function animateRenderedMove(originRect,to,captured,capturedSide){
 requestAnimationFrame(()=>{
  const targetCell=cellAt(to[0],to[1]),piece=targetCell&&targetCell.querySelector('.piece');
  if(piece&&piece.animate&&!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
   const rect=targetCell.getBoundingClientRect(),dx=originRect.left-rect.left,dy=originRect.top-rect.top;
   piece.classList.add('moving');
   const animation=piece.animate([
    {transform:'translate('+dx+'px,'+dy+'px) scale(.94)',filter:'brightness(1.08)',offset:0},
    {transform:'translate('+(dx*.12)+'px,'+(dy*.12)+'px) scale(1.035)',filter:'brightness(1.04)',offset:.78},
    {transform:'translate(0,0) scale(1)',filter:'brightness(1)',offset:1}
   ],{duration:340,easing:'cubic-bezier(.2,.8,.2,1)'});
   animation.onfinish=()=>piece.classList.remove('moving');
  }
  if(captured){
   const cell=cellAt(captured[0],captured[1]);
   if(cell)cell.classList.add('captured');
   if(cell&&boardEl.animate!==undefined&&!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
    const boardRect=boardEl.getBoundingClientRect(),cellRect=cell.getBoundingClientRect();
    const cx=cellRect.left-boardRect.left+cellRect.width/2,cy=cellRect.top-boardRect.top+cellRect.height/2;
    const shades=capturedSide==='w'?['#ffffff','#d9e0eb','#aebbd0']:['#333b4b','#10151f','#596273'];
    for(let i=0;i<9;i++){
     const shard=document.createElement('span');shard.className='shard';shard.style.width=(5+Math.random()*5)+'%';shard.style.height=(5+Math.random()*5)+'%';shard.style.background=shades[i%shades.length];shard.style.left=cx+'px';shard.style.top=cy+'px';boardEl.appendChild(shard);
     const angle=(Math.PI*2*i/9)+(Math.random()-.5)*.35,dist=cellRect.width*(.5+Math.random()*.85),dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist-cellRect.height*(.1+Math.random()*.45);
     const anim=shard.animate([{transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1},{transform:'translate(calc(-50% + '+(dx*.72)+'px),calc(-50% + '+(dy-6)+'px)) scale(.72) rotate('+(180+i*31)+'deg)',opacity:.85,offset:.65},{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+(dy+cellRect.height*.65)+'px)) scale(.12) rotate('+(360+i*53)+'deg)',opacity:0}],{duration:520,easing:'cubic-bezier(.18,.65,.35,1)',delay:i*9});
     anim.onfinish=()=>shard.remove();
    }
   }
   setTimeout(()=>{const cell=cellAt(captured[0],captured[1]);if(cell)cell.classList.remove('captured')},420);
  }
 });
}
function perform(m){save();const [r,c]=m.from,[rr,cc]=m.to,p=b[r][c];const sourceCell=cellAt(r,c);pendingMoveOrigin=sourceCell?sourceCell.getBoundingClientRect():null;lastAnimatedFrom=[r,c];lastAnimatedTo=[rr,cc];lastCaptured=m.cap?m.cap.slice():null;lastCapturedSide=m.cap&&b[m.cap[0]][m.cap[1]]?b[m.cap[0]][m.cap[1]].side:null;b[rr][cc]=p;b[r][c]=null;if(m.cap){const [cr,ccap]=m.cap;b[cr][ccap]=null}
 if((p.side==='w'&&rr===0)||(p.side==='b'&&rr===7))p.king=true;
 if(m.cap){const more=movesFor(rr,cc,true);if(more.length){mustContinueCapture=true;selected=[rr,cc];legal=more;broadcastState();render();if(mode==='cpu'&&turn===cpuSide()&&!online)scheduleCpuMove(350);return}}
 mustContinueCapture=false;selected=null;legal=[];turn=turn==='w'?'b':'w';turnSnapshotSaved=false;const next=allMoves(turn);if(!next.length){gameOver=true;const winner=turn==='w'?'b':'w';statusEl.textContent='Победа '+(winner==='w'?'белых':'чёрных')+'!';hintEl.textContent='У соперника не осталось ходов.';broadcastState();render();showResult(winner);return}
 broadcastState();render();if(mode==='cpu'&&turn===cpuSide()&&!gameOver)scheduleCpuMove(350)}
function choose(r,c){if(gameOver||mode==='cpu'&&turn===cpuSide()||online&&turn!==mySide)return;
 if(selected&&legal.some(m=>m.to[0]===r&&m.to[1]===c)){perform(legal.find(m=>m.to[0]===r&&m.to[1]===c));return}
 if(mustContinueCapture)return;
 if(b[r][c]?.side===turn){const all=allMoves(turn);selected=[r,c];legal=all.filter(m=>m.from[0]===r&&m.from[1]===c);if(!legal.length){selected=null;legal=[]}render();return}
 selected=null;legal=[];render()}
function cpuMove(){const side=cpuSide();if(gameOver||turn!==side||mode!=='cpu')return;const continuing=selected&&legal.length&&legal.every(m=>m.from[0]===selected[0]&&m.from[1]===selected[1]);const ms=continuing?legal.slice():allMoves(side);if(!ms.length)return;ms.sort((a,z)=>(z.cap?10:0)+(b[z.to[0]][z.to[1]]?.king?1:0)-((a.cap?10:0)+(b[a.to[0]][a.to[1]]?.king?1:0)));perform(ms[0])}
function updatePlayerStrip(){
 const white=document.getElementById('playerWhite'),black=document.getElementById('playerBlack');
 if(!white||!black)return;
 const labelWhite=document.getElementById('labelWhite'),labelBlack=document.getElementById('labelBlack');
 if(online){labelWhite.textContent=mySide==='w'?'Вы':'Друг';labelBlack.textContent=mySide==='b'?'Вы':'Друг'}
 else if(mode==='cpu'){labelWhite.textContent='Вы';labelBlack.textContent='Компьютер'}
 else{labelWhite.textContent='Игрок 1';labelBlack.textContent='Игрок 2'}
 white.classList.toggle('is-turn',!gameOver&&turn==='w');
 black.classList.toggle('is-turn',!gameOver&&turn==='b');
}
function render(){const animationOrigin=pendingMoveOrigin,animationTarget=lastAnimatedTo?lastAnimatedTo.slice():null,captureForRender=lastCaptured?lastCaptured.slice():null,capturedSideForRender=lastCapturedSide,fragment=document.createDocumentFragment();for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,cell=document.createElement('button');cell.className='cell '+((r+c)%2?'dark':'light');cell.dataset.row=r;cell.dataset.col=c;cell.setAttribute('aria-label',String.fromCharCode(65+c)+(8-r));cell.onclick=()=>choose(r,c);if(selected&&selected[0]===r&&selected[1]===c)cell.classList.add('selected');if(legal.some(m=>m.to[0]===r&&m.to[1]===c))cell.classList.add('move');if(captureForRender&&captureForRender[0]===r&&captureForRender[1]===c)cell.classList.add('captured');const p=b[r][c];if(p){const piece=document.createElement('div');piece.className='piece '+(p.side==='w'?'white':'black')+(p.king?' king':'');cell.appendChild(piece)}fragment.appendChild(cell)}
 boardEl.replaceChildren(fragment);
 pendingMoveOrigin=null;lastAnimatedFrom=null;lastAnimatedTo=null;lastCaptured=null;lastCapturedSide=null;
 if(animationOrigin&&animationTarget)animateRenderedMove(animationOrigin,animationTarget,captureForRender,capturedSideForRender);
 if(!gameOver){statusEl.textContent=(mode==='cpu'||online)?(turn===mySide?'Ваш ход':(online?'Ход соперника':'Ход компьютера')):'Ход '+(turn==='w'?'белых':'чёрных');hintEl.textContent=mustContinueCapture?'Продолжайте взятие этой шашкой.':(mode==='cpu'&&turn===cpuSide())?'Компьютер выбирает ход…':(online&&turn!==mySide)?'Ожидайте хода соперника.':'Выберите шашку, затем клетку для хода.'}updatePlayerStrip()}
function statePacket(){return {type:'state',b,turn,gameOver,lastMove:lastAnimatedFrom&&lastAnimatedTo?{from:lastAnimatedFrom,to:lastAnimatedTo,cap:lastCaptured,capSide:lastCapturedSide}:null};}
function broadcastState(){if(onlineConn&&onlineConn.open)onlineConn.send(statePacket())}
function isValidRemoteBoard(remote){return Array.isArray(remote)&&remote.length===8&&remote.every(row=>Array.isArray(row)&&row.length===8&&row.every(p=>p===null||(p&&typeof p==='object'&&(p.side==='w'||p.side==='b')&&typeof p.king==='boolean')))}
function applyPacket(data){if(!data||data.type!=='state'||!isValidRemoteBoard(data.b)||(data.turn!=='w'&&data.turn!=='b'))return;mustContinueCapture=false;turnSnapshotSaved=false;pendingMoveOrigin=null;const move=data.lastMove;if(move&&Array.isArray(move.from)&&Array.isArray(move.to)){const sourceCell=cellAt(move.from[0],move.from[1]);pendingMoveOrigin=sourceCell?sourceCell.getBoundingClientRect():null;lastAnimatedFrom=move.from.slice();lastAnimatedTo=move.to.slice();lastCaptured=Array.isArray(move.cap)?move.cap.slice():null;lastCapturedSide=move.capSide||null;}else{lastAnimatedFrom=null;lastAnimatedTo=null;lastCaptured=null;lastCapturedSide=null;}b=data.b;turn=data.turn;gameOver=!!data.gameOver;selected=null;legal=[];history=[];render();if(gameOver){hintEl.textContent='Партия завершена.';showResult(turn==='w'?'b':'w')}else hideResult()}
function setOnlineConnection(conn,role){if(cpuTimer!==null){clearTimeout(cpuTimer);cpuTimer=null}onlineConn=conn;online=true;mode='online';mySide=role;flipped=role==='b';document.querySelectorAll('input[name="playerColor"]').forEach(input=>input.checked=input.value===role);document.getElementById('mode').textContent='Режим: онлайн';conn.on('open',()=>{onlineInfo.textContent=role==='w'?'Друг подключился! Вы играете белыми.':'Подключено! Вы играете чёрными.';if(role==='w')conn.send(statePacket());else conn.send({type:'request-state'});render()});conn.on('data',data=>{if(data?.type==='state')applyPacket(data);else if(data?.type==='request-state'&&role==='w')conn.send(statePacket())});conn.on('close',()=>{onlineInfo.textContent='Связь с другом прервана.';onlineConn=null;if(online){online=false;mode='cpu';mySide=preferredSide;flipped=preferredSide==='b';document.getElementById('mode').textContent='Режим: против компьютера';initial()}});conn.on('error',()=>{onlineInfo.textContent='Ошибка соединения. Попробуйте подключиться снова.'})}
function ensurePeerSdk(){if(window.Peer)return Promise.resolve(true);if(peerSdkPromise)return peerSdkPromise;peerSdkPromise=new Promise(resolve=>{const script=document.createElement('script');script.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';script.async=true;script.onload=()=>{const loaded=!!window.Peer;if(!loaded)peerSdkPromise=null;resolve(loaded)};script.onerror=()=>{peerSdkPromise=null;resolve(false)};document.head.appendChild(script)});return peerSdkPromise}
function destroyOnline(){online=false;onlineConn=null;if(onlinePeer){onlinePeer.destroy();onlinePeer=null}mySide=preferredSide;flipped=preferredSide==='b';onlinePanel.hidden=true;document.querySelectorAll('input[name="playerColor"]').forEach(input=>input.checked=input.value===preferredSide);}
document.getElementById('online').onclick=()=>{onlinePanel.hidden=!onlinePanel.hidden;if(!onlinePanel.hidden)onlineInfo.textContent='Создайте комнату и отправьте другу ссылку или введите код друга.'};
document.getElementById('createRoom').onclick=async()=>{onlineInfo.textContent='Загружаем онлайн-модуль…';if(!(await ensurePeerSdk())){onlineInfo.textContent='Не удалось загрузить онлайн-модуль. Проверьте интернет и попробуйте снова.';return}if(onlinePeer)onlinePeer.destroy();onlineInfo.textContent='Создаём комнату…';onlinePeer=new Peer();onlinePeer.on('open',id=>{roomCode.value=id;const u=new URL(window.location.href);u.searchParams.set('peer',id);inviteLink.value=u.toString();onlineInfo.textContent='Комната создана. Отправьте другу ссылку или код комнаты. Ожидаем подключение…';online=true;mode='online';mySide='w';initial();document.querySelectorAll('input[name="playerColor"]').forEach(input=>input.checked=input.value==='w');document.getElementById('mode').textContent='Режим: онлайн'});onlinePeer.on('connection',conn=>{if(onlineConn){conn.close();return}setOnlineConnection(conn,'w')});onlinePeer.on('error',err=>{onlineInfo.textContent='Не удалось создать комнату: '+(err.type||'ошибка соединения')})};
document.getElementById('joinRoom').onclick=async()=>{const id=(roomCode.value||new URL(location.href).searchParams.get('peer')||'').trim();if(!id){onlineInfo.textContent='Введите код комнаты или откройте ссылку-приглашение.';return}onlineInfo.textContent='Загружаем онлайн-модуль…';if(!(await ensurePeerSdk())){onlineInfo.textContent='Не удалось загрузить онлайн-модуль. Проверьте интернет и попробуйте снова.';return}if(onlinePeer)onlinePeer.destroy();onlineInfo.textContent='Подключаемся к комнате…';onlinePeer=new Peer();onlinePeer.on('open',()=>{const conn=onlinePeer.connect(id,{reliable:true});setOnlineConnection(conn,'b')});onlinePeer.on('error',err=>{onlineInfo.textContent='Не удалось подключиться: '+(err.type||'ошибка соединения')})};
document.getElementById('copyInvite').onclick=async()=>{const val=inviteLink.value||roomCode.value;if(!val){onlineInfo.textContent='Сначала создайте комнату.';return}try{await navigator.clipboard.writeText(val);onlineInfo.textContent='Ссылка скопирована — отправьте её другу.'}catch(e){inviteLink.focus();inviteLink.select();onlineInfo.textContent='Скопируйте выделенную ссылку вручную.'}};
document.getElementById('shareInvite').onclick=async()=>{const val=inviteLink.value;if(!val){onlineInfo.textContent='Сначала создайте комнату, чтобы получить ссылку-приглашение.';return}const text='Сыграем в шашки онлайн! Открой ссылку и нажми «Подключиться».';const tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.openTelegramLink){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(val)+'&text='+encodeURIComponent(text));return}if(navigator.share){try{await navigator.share({title:'Шашки онлайн',text,url:val});onlineInfo.textContent='Приглашение отправлено.';return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text+' '+val);onlineInfo.textContent='Текст и ссылка скопированы — отправьте их другу.'}catch(e){inviteLink.focus();inviteLink.select();onlineInfo.textContent='Скопируйте ссылку выше и отправьте другу.'}};
document.getElementById('closeOnline').onclick=()=>{destroyOnline();mode='cpu';document.getElementById('mode').textContent='Режим: против компьютера';initial();onlineInfo.textContent='Онлайн-режим закрыт.'};
document.getElementById('new').onclick=()=>{initial();if(online)broadcastState()};
document.getElementById('resultNew').onclick=()=>document.getElementById('new').click();
document.getElementById('resultClose').onclick=hideResult;
document.getElementById('mode').onclick=()=>{if(online){onlineInfo.textContent='Для выхода нажмите «Выйти из онлайн-игры».';return}mode=mode==='cpu'?'local':'cpu';document.getElementById('mode').textContent='Режим: '+(mode==='cpu'?'против компьютера':'2 игрока');initial()};
document.getElementById('undo').onclick=()=>{if(cpuTimer!==null){clearTimeout(cpuTimer);cpuTimer=null}if(online){onlineInfo.textContent='Отмена хода в онлайн-партии отключена, чтобы не рассинхронизировать игроков.';return}if(!history.length)return;const restore=()=>{const s=history.pop();b=s.b;turn=s.turn;gameOver=s.gameOver};restore();if(mode==='cpu'&&turn===cpuSide()&&history.length)restore();turnSnapshotSaved=false;mustContinueCapture=false;selected=null;legal=[];hideResult();render();if(mode==='cpu'&&turn===cpuSide()&&!gameOver)scheduleCpuMove(350)};
document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};
const mainEl=document.querySelector('main');
const menuToggle=document.getElementById('menuToggle'),menuPane=document.getElementById('menuPane');
function switchMenu(open){
 const isOpen=Boolean(open);
 mainEl.dataset.menuOpen=String(isOpen);
 menuToggle.setAttribute('aria-expanded',String(isOpen));
 menuToggle.setAttribute('aria-label',isOpen?'Закрыть меню':'Открыть меню');

 if(isOpen)document.getElementById('closeMenu').focus();
}
menuToggle.onclick=()=>switchMenu(mainEl.dataset.menuOpen!=='true');

document.querySelectorAll('input[name="playerColor"]').forEach(input=>input.checked=input.value===preferredSide);
document.getElementById('applySettings').onclick=()=>{if(online){document.querySelectorAll('input[name="playerColor"]').forEach(input=>input.checked=input.value===mySide);onlineInfo.textContent='В онлайн-партии цвет назначается автоматически.';switchMenu(false);return}const chosen=document.querySelector('input[name="playerColor"]:checked');preferredSide=chosen?chosen.value:'w';mySide=preferredSide;try{localStorage.setItem('shashki-player-color',preferredSide)}catch(e){}if(mode==='cpu'){initial()}else{flipped=preferredSide==='b';render()}switchMenu(false)};

initial();
const incomingPeer=new URL(window.location.href).searchParams.get('peer');if(incomingPeer){switchMenu(true);onlinePanel.hidden=false;roomCode.value=incomingPeer;onlineInfo.textContent='Открыта ссылка-приглашение. Нажмите «Подключиться».'}
})();
